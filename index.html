    <!-- Shim for iframe environment where window.fetch has only a getter -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // Suppress unhandled TypeError if any external/injected script reassigns fetch
            window.addEventListener('error', function(e) {
              if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
                if (typeof e.preventDefault === 'function') e.preventDefault();
                if (typeof e.stopPropagation === 'function') e.stopPropagation();
                return true;
              }
            }, true);

            var rawFetch = window.fetch;
            var currentFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : null;
            var descriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            };

            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (err) {}

            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (err) {}
            }
          }
        } catch (e) {
          // Silent fallback
        }
      })();
    </script>
